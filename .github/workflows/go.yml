# Excel2JSON 跨平台构建和发布工作流
# 根据 build.sh 的逻辑，支持多平台构建和版本管理

name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'  # 当推送版本 tag 时触发发布
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 1.0.0)'
        required: false
        type: string
      create_release:
        description: '是否创建 GitHub Release'
        required: false
        default: false
        type: boolean

jobs:
  # 测试任务
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'  # 使用稳定的 Go 版本

    - name: 验证测试文件
      run: |
        echo "检查测试文件是否存在..."
        if [ -f "./assets/abc.xlsx" ]; then
          echo "✅ 测试文件存在: ./assets/abc.xlsx"
          ls -lh ./assets/abc.xlsx
        else
          echo "⚠️  警告: 测试文件不存在: ./assets/abc.xlsx"
          echo "列出 assets 目录内容:"
          ls -la ./assets/ || echo "assets 目录不存在"
        fi

    - name: Test
      run: go test -v ./...

  # 多平台构建任务
  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            binary_name: excel2json
            output_name: excel2json-linux-amd64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            binary_name: excel2json
            output_name: excel2json-macos-intel
          - os: macos-latest
            goos: darwin
            goarch: arm64
            binary_name: excel2json
            output_name: excel2json-macos-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            binary_name: excel2json.exe
            output_name: excel2json-windows-amd64.exe

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整历史以计算 git commit

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'  # 使用稳定的 Go 版本

    - name: 获取版本号
      id: version
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
          VERSION="${{ github.event.inputs.version }}"
        elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VERSION="${GITHUB_REF#refs/tags/v}"
        else
          VERSION="dev-${GITHUB_SHA::7}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "版本号: $VERSION"

    - name: 构建信息
      id: build_info
      shell: bash
      run: |
        BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S')
        GIT_COMMIT=$(git rev-parse --short HEAD)
        echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT
        echo "git_commit=$GIT_COMMIT" >> $GITHUB_OUTPUT
        echo "构建时间: $BUILD_TIME"
        echo "Git提交: $GIT_COMMIT"

    - name: 构建二进制文件
      shell: bash
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        VERSION: ${{ steps.version.outputs.version }}
        BUILD_TIME: ${{ steps.build_info.outputs.build_time }}
        GIT_COMMIT: ${{ steps.build_info.outputs.git_commit }}
      run: |
        set -e
        OUTPUT_NAME="excel2json-v${VERSION}-${{ matrix.output_name }}"
        LD_FLAGS="-X main.version=${VERSION} -X 'main.buildTime=${BUILD_TIME}' -X main.gitCommit=${GIT_COMMIT}"
        echo "开始构建: GOOS=$GOOS GOARCH=$GOARCH"
        echo "输出文件: $OUTPUT_NAME"
        go version
        go build -ldflags "$LD_FLAGS" -o "$OUTPUT_NAME" main.go
        if [ -f "$OUTPUT_NAME" ]; then
          ls -lh "$OUTPUT_NAME" 2>/dev/null || echo "文件已创建: $OUTPUT_NAME"
          echo "✅ 构建完成: $OUTPUT_NAME"
        else
          echo "❌ 构建失败: 文件不存在"
          echo "当前目录内容:"
          ls -la . 2>/dev/null || dir
          exit 1
        fi

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.output_name }}-v${{ steps.version.outputs.version }}
        path: excel2json-v${{ steps.version.outputs.version }}-${{ matrix.output_name }}
        retention-days: 30
        if-no-files-found: error

  # 创建 Release
  # 触发条件：
  # 1. 推送 v* 格式的 tag（推荐）：git tag v1.0.0 && git push origin v1.0.0
  # 2. 手动触发并选择创建 release
  # 3. 推送到 main 分支且 commit message 包含 [release] 或 [version: x.x.x]
  release:
    needs: build
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[version:')))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 获取版本号
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
          # 手动触发时使用输入的版本号
          VERSION="${{ github.event.inputs.version }}"
        elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          # 从 tag 中提取版本号
          VERSION="${GITHUB_REF#refs/tags/v}"
        elif [[ "${{ github.event.head_commit.message }}" =~ \[version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+) ]]; then
          # 从 commit message 中提取版本号，例如: [version: 1.0.0]
          VERSION="${BASH_REMATCH[1]}"
        elif [[ "${{ github.event.head_commit.message }}" == *"[release]"* ]]; then
          # 如果只有 [release] 标记，使用 dev 版本
          VERSION="dev-${GITHUB_SHA::7}"
          echo "⚠️  警告: 使用 dev 版本，建议使用 [version: x.x.x] 格式"
        else
          echo "❌ 无法确定版本号"
          echo "请使用以下方式之一："
          echo "  1. 推送 tag: git tag v1.0.0 && git push origin v1.0.0"
          echo "  2. Commit message 包含: [version: 1.0.0]"
          echo "  3. 手动触发 workflow 并输入版本号"
          exit 1
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "版本号: $VERSION"

    - name: 下载所有构建产物
      uses: actions/download-artifact@v4
      with:
        path: ./dist
        pattern: '*-v${{ steps.version.outputs.version }}'
        merge-multiple: false

    - name: 收集所有构建文件
      shell: bash
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        mkdir -p ./release
        echo "查找构建文件..."
        find ./dist -type f -name "excel2json-v${VERSION}-*" | while read file; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            cp "$file" "./release/$filename"
            echo "复制: $file -> ./release/$filename"
          fi
        done
        echo "📦 收集到的文件："
        ls -lh ./release/ || echo "release 目录为空"
        # 验证文件数量
        FILE_COUNT=$(ls -1 ./release/ 2>/dev/null | wc -l)
        if [ "$FILE_COUNT" -lt 4 ]; then
          echo "⚠️  警告: 只找到 $FILE_COUNT 个文件，预期 4 个"
          echo "dist 目录内容："
          find ./dist -type f || echo "未找到文件"
        else
          echo "✅ 成功收集 $FILE_COUNT 个文件"
        fi

    - name: 创建 Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Release v${{ steps.version.outputs.version }}
        body: |
          ## Excel2JSON v${{ steps.version.outputs.version }}

          ### 📦 构建产物

          - `excel2json-v${{ steps.version.outputs.version }}-macos-intel` - macOS Intel 版本
          - `excel2json-v${{ steps.version.outputs.version }}-macos-arm64` - macOS Apple Silicon 版本
          - `excel2json-v${{ steps.version.outputs.version }}-windows-amd64.exe` - Windows 版本
          - `excel2json-v${{ steps.version.outputs.version }}-linux-amd64` - Linux 版本

          ### 🚀 使用示例

          ```bash
          # macOS
          ./excel2json-v${{ steps.version.outputs.version }}-macos-arm64 -file=./assets/abc.xlsx -output_path=./output/

          # Windows
          ./excel2json-v${{ steps.version.outputs.version }}-windows-amd64.exe -file=./assets/abc.xlsx -output_path=./output/

          # Linux
          ./excel2json-v${{ steps.version.outputs.version }}-linux-amd64 -file=./assets/abc.xlsx -output_path=./output/
          ```
        files: |
          ./release/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
